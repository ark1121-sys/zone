    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50 p-8 md:p-12">
        <!-- Header -->
        <div class="flex items-center gap-5 mb-10">
            <div class="p-4 bg-green-50 rounded-2xl shadow-sm border border-green-100">
                <i data-lucide="grid" class="w-8 h-8 text-accent-main"></i>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-gray-900 tracking-tight uppercase">Market Heatmap</h1>
                <p class="text-gray-500 mt-1 font-medium">Sector-wise stock performance visualization</p>
            </div>
        </div>

        <!-- Heatmap Grid -->
        <div id="heatmap" class="shadow-sm border border-gray-100">
            <div class="heatmap-header">
                <div class="heatmap-title">
                    <span>Heatmap</span>
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                </div>
            </div>

            <div id="heatmapContainer" class="heatmap-root"></div>

            <div class="heatmap-controls">
                <div class="heatmap-filter-box">
                    <label for="sectorFilter">Sector</label>
                    <select id="sectorFilter">
                        <option value="all">All</option>
                    </select>

                    <label for="changeFilter">Change</label>
                    <select id="changeFilter">
                        <option value="all">All</option>
                        <option value="gainers">Gainers</option>
                        <option value="losers">Losers</option>
                        <option value="neutral">Neutral</option>
                    </select>
                </div>

                <div class="heatmap-legend">
                    <span>-2%</span>
                    <div class="legend-strip legend-red-dark"></div>
                    <div class="legend-strip legend-red"></div>
                    <div class="legend-strip legend-neutral"></div>
                    <div class="legend-strip legend-green"></div>
                    <div class="legend-strip legend-green-dark"></div>
                    <span>2%</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const LOGO_DEV_TOKEN = "pk_N2e20U-cRgeS7JVxXojiBw";

        const sectorOrder = [
            "Finance",
            "Technology Services",
            "Consumer Non-Durables",
            "Consumer Durables",
            "Energy Minerals",
            "Non Energy Minerals",
            "Industrial Services",
            "Utilities",
            "Communications",
            "Process Industries",
            "Health Technology",
            "Others"
        ];

        function createTileColor(change) {
            if (change >= 1.5) return "tile-green-dark";
            if (change > 0) return "tile-green";
            if (change === 0) return "tile-neutral";
            if (change > -1.5) return "tile-red";
            return "tile-red-dark";
        }

        function getLogo(domain) {
            if (!domain || !LOGO_DEV_TOKEN || LOGO_DEV_TOKEN === "YOUR_LOGO_DEV_PUBLISHABLE_KEY") {
                return "";
            }
            return `https://img.logo.dev/${domain}?token=${LOGO_DEV_TOKEN}&size=64&format=png`;
        }

        function populateSectorFilter(data) {
            const sectorFilter = document.getElementById("sectorFilter");
            if (!sectorFilter) return;

            const currentValue = sectorFilter.value || "all";
            const sectors = [...new Set(data.map(item => item.sector).filter(Boolean))];

            sectorFilter.innerHTML = `<option value="all">All</option>`;

            sectors.forEach(sector => {
                const option = document.createElement("option");
                option.value = sector;
                option.textContent = sector;
                sectorFilter.appendChild(option);
            });

            sectorFilter.value = sectors.includes(currentValue) ? currentValue : "all";
        }

        async function loadHeatmap() {
            const container = document.getElementById("heatmapContainer");
            try {
                // Show loading indicator if container is empty
                if (container.innerHTML === "") {
                    container.innerHTML = `<div class="w-full flex items-center justify-center p-20 text-white font-medium">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-white mr-4"></div>
                        Fetching live market data...
                    </div>`;
                }

                const res = await fetch("/api/heatmap");
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const data = await res.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = `<div class="w-full text-center p-20 text-white">No stock data available at the moment.</div>`;
                    return;
                }

                populateSectorFilter(data);

                const selectedSector = document.getElementById("sectorFilter")?.value || "all";
                const selectedChange = document.getElementById("changeFilter")?.value || "all";

                const filteredData = data.filter(stock => {
                    const sectorOk = selectedSector === "all" || stock.sector === selectedSector;

                    let changeOk = true;
                    const change = Number(stock.change) || 0;

                    if (selectedChange === "gainers") changeOk = change > 0.05;
                    else if (selectedChange === "losers") changeOk = change < -0.05;
                    else if (selectedChange === "neutral") changeOk = Math.abs(change) <= 0.05;

                    return sectorOk && changeOk;
                });

                if (filteredData.length === 0) {
                    container.innerHTML = `<div class="w-full text-center p-20 text-white">No stocks match the selected filters.</div>`;
                    return;
                }

                const grouped = filteredData.reduce((acc, stock) => {
                    const sector = stock.sector || "Others";
                    if (!acc[sector]) acc[sector] = [];
                    acc[sector].push(stock);
                    return acc;
                }, {});

                container.innerHTML = "";

                const sectorFlexMap = {
                    "Finance": "2.4 1 30%",
                    "Technology Services": "2.3 1 30%",
                    "Consumer Non-Durables": "1.5 1 20%",
                    "Consumer Durables": "1.5 1 20%",
                    "Energy Minerals": "1.8 1 25%",
                    "Non Energy Minerals": "1.5 1 20%",
                    "Industrial Services": "1.2 1 15%",
                    "Utilities": "1.2 1 15%",
                    "Communications": "1.2 1 15%",
                    "Process Industries": "1.2 1 15%",
                    "Health Technology": "1.2 1 15%",
                    "Others": "1.2 1 15%"
                };

                // Filter out empty sectors from sectorOrder
                const activeSectors = sectorOrder.filter(s => grouped[s] && grouped[s].length > 0);
                
                // If a sector exists in data but not in sectorOrder, add it to the end
                Object.keys(grouped).forEach(s => {
                    if (!activeSectors.includes(s)) activeSectors.push(s);
                });

                activeSectors.forEach(sector => {
                    const stocks = grouped[sector];
                    if (!stocks || !stocks.length) return;

                    const section = document.createElement("section");
                    section.className = "sector-block";
                    section.style.flex = sectorFlexMap[sector] || "1 1 20%";

                    const title = document.createElement("div");
                    title.className = "sector-title";
                    title.textContent = sector;

                    const inner = document.createElement("div");
                    inner.className = "sector-inner";

                    const totalWeight = stocks.reduce((sum, stock) => sum + Number(stock.weight || 1), 0);

                    stocks.forEach(stock => {
                        const change = Number(stock.change) || 0;
                        const weight = Number(stock.weight || 1);
                        const share = (weight / totalWeight) * 100;
                        const logoUrl = getLogo(stock.domain);

                        const tile = document.createElement("div");
                        tile.className = `stock-tile ${createTileColor(change)}`;
                        tile.title = `${stock.symbol}: ${change > 0 ? '+' : ''}${change.toFixed(2)}%`;

                        // Responsive flex and height based on share
                        tile.style.flex = `${Math.max(share, 5)} 1 0%`;
                        tile.style.minHeight = share > 30 ? "140px" : share > 15 ? "100px" : "70px";

                        tile.innerHTML = `
                            ${logoUrl ? `
                                <img class="stock-logo"
                                     src="${logoUrl}"
                                     alt="${stock.symbol}"
                                     loading="lazy"
                                     referrerpolicy="no-referrer"
                                     onerror="this.style.display='none'" />
                            ` : ""}
                            <div class="stock-symbol">${stock.symbol}</div>
                            <div class="stock-change">${change > 0 ? '+' : ''}${change.toFixed(2)}%</div>
                        `;

                        inner.appendChild(tile);
                    });

                    section.appendChild(title);
                    section.appendChild(inner);
                    container.appendChild(section);
                });

                if (window.lucide) {
                    lucide.createIcons();
                }
            } catch (err) {
                console.error("Heatmap error:", err);
                container.innerHTML = `<div class="w-full text-center p-20 text-red-400">
                    <p class="font-bold text-lg mb-2">Error Loading Heatmap</p>
                    <p class="text-sm">${err.message || "Failed to fetch market data."}</p>
                    <button onclick="loadHeatmap()" class="mt-4 px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg transition-colors text-white">Retry</button>
                </div>`;
            }
        }

        loadHeatmap();

        document.getElementById("sectorFilter")?.addEventListener("change", loadHeatmap);
        document.getElementById("changeFilter")?.addEventListener("change", loadHeatmap);

        setInterval(loadHeatmap, 60000); // Update every minute

        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
