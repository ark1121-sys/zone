<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Option Screener - Zone Pro Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'accent-main': '#4CAF50',
                'accent-light': '#81C784',
                'accent-dark': '#388E3C',
                'sidebar-active': '#e8f5e9',
                'text-heading': '#2c3e50',
                'text-dark': '#34495e',
                'text-muted': '#7f8c8d',
              },
              fontFamily: {
                'inter': ['Inter', 'sans-serif'],
                'montserrat': ['Montserrat', 'sans-serif'],
              }
            }
          }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        aside::-webkit-scrollbar { width: 6px; }
        aside::-webkit-scrollbar-thumb { background-color: #e5e7eb; border-radius: 3px; }
        
        /* Iframe Cropping and Styling */
        .iframe-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background: #fff;
        }
        
        .iframe-content {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transition: filter 0.3s ease;
        }

        /* Dark Mode Filter for Iframe */
        /* Invert colors, then rotate hue 180deg to restore Red/Green semantic colors */
        .iframe-dark {
            filter: invert(0.92) hue-rotate(180deg) contrast(1.1);
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-72 bg-white border-r border-gray-100 flex flex-col hidden md:flex h-full shadow-sm z-10">
        <!-- Sidebar Header -->
        <div class="p-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="../assets/images/logo bg.png" alt="Zone Pro Trader" class="site-logo w-14 h-14">
                <div>
                    <h1 class="font-montserrat font-bold text-gray-900 text-lg tracking-tight">ZONE PRO</h1>
                    <p class="text-[10px] font-bold text-accent-main tracking-widest uppercase">TRADER</p>
                </div>
            </div>
            <!-- Mobile Toggle -->
            <button class="md:hidden text-gray-400 hover:text-gray-600 transition-colors ml-auto">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-2 space-y-1 pr-4">
            
            <!-- Journal Feed -->
            <a href="dashboard.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="newspaper" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                JOURNAL FEED
            </a>

            <!-- Journal Reporting -->
            <a href="journal-reporting.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                JOURNAL REPORTING
            </a>

            <!-- Investment Screener -->
            <a href="investment-screener.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="search" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                INVESTMENT SCREENER
            </a>

            <!-- Intraday -->
            <a href="intraday.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="clock" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                INTRADAY
            </a>

            <!-- Heatmap -->
            <a href="heatmap.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="grid" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                HEATMAP
            </a>

            <!-- Options (F&O) -->
            <a href="options.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="trending-up" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                OPTIONS (F&O)
            </a>

            <!-- Other Tools (Active) -->
            <a href="other-tools.html" class="flex items-center px-6 py-3.5 text-sm font-bold text-accent-dark bg-green-50 rounded-r-full border-l-4 border-accent-main transition-all group shadow-sm">
                <div class="p-2 bg-green-100 rounded-lg mr-3 group-hover:bg-green-200 transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5 text-accent-dark"></i>
                </div>
                OTHER TOOLS
            </a>

            <!-- Announcements -->
            <a href="announcements.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="megaphone" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                ANNOUNCEMENTS
            </a>

            <!-- Open a Demat Account -->
            <a href="open-demat-account.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="briefcase" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                OPEN A DEMAT ACCOUNT
            </a>

            <!-- My Profile -->
            <a href="my-profile.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="user" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                MY PROFILE
            </a>
        </nav>

        <!-- Logout -->
        <div class="p-6 border-t border-gray-100 mt-auto">
            <a href="logout.html" class="flex items-center px-4 py-3 text-sm font-medium text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all group">
                <i data-lucide="log-out" class="w-5 h-5 mr-3 group-hover:text-red-600 transition-colors"></i>
                LOGOUT
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden bg-gray-50 flex flex-col h-screen">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 bg-white border-b border-gray-200 shadow-sm z-20">
            <div class="flex items-center gap-4">
                <a href="other-tools.html" class="p-2.5 bg-white border border-gray-200 hover:bg-gray-50 rounded-xl shadow-sm transition-all group flex items-center gap-2">
                    <i data-lucide="arrow-left" class="w-5 h-5 text-gray-500 group-hover:text-accent-main transition-colors"></i>
                    <span class="hidden md:inline text-sm font-bold text-gray-600 group-hover:text-accent-main uppercase">Back to Tools</span>
                </a>
                <div>
                    <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                        <i data-lucide="table" class="w-5 h-5 text-accent-main"></i>
                        STOCK OPTION SCREENER
                    </h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors flex items-center gap-2 text-sm font-medium">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                    <span id="darkModeText">Dark Mode</span>
                </button>
                
                <!-- Refresh Button -->
                <button onclick="refreshIframe()" class="p-2 rounded-lg bg-green-50 text-accent-dark hover:bg-green-100 transition-colors flex items-center gap-2 text-sm font-medium">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    Refresh Data
                </button>

                <a href="https://chartink.com/screener/top-gainers-f-o-7" target="_blank" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500 transition-colors">
                    <i data-lucide="external-link" class="w-5 h-5"></i>
                </a>
            </div>
        </div>

        <!-- Data Table Container -->
        <div class="flex-1 overflow-hidden bg-white p-4" id="screener-container">
            <div class="iframe-container">
                <iframe 
                    id="screener-iframe"
                    src="/screener/top-gainers-f-o-7" 
                    class="iframe-content"
                    title="Stock Option Screener"
                ></iframe>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function refreshIframe() {
            const iframe = document.getElementById('screener-iframe');
            iframe.src = iframe.src;
        }

        function toggleDarkMode() {
            const iframe = document.getElementById('screener-iframe');
            const btnText = document.getElementById('darkModeText');
            
            iframe.classList.toggle('iframe-dark');
            
            if (iframe.classList.contains('iframe-dark')) {
                btnText.textContent = "Light Mode";
            } else {
                btnText.textContent = "Dark Mode";
            }
        }
    </script>
</body>
</html>
