                'accent-light': '#81C784',
                'accent-dark': '#388E3C',

                'text-dark': '#34495e',
                'text-muted': '#7f8c8d',
                'dot-green': '#10B981',
                'dot-purple': '#A78BFA',
                'dot-orange': '#F59E0B',
                'dot-red': '#EF4444',

              },

    <link rel="icon" type="image/png" href="../assets/images/logo bg.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/script.js" defer></script>
    <script>
        (function() {
            const user = localStorage.getItem('zp_user');
            if (!user) {
                window.location.href = 'login.html';
            }
        })();
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for sidebar */

            width: 6px;

        aside::-webkit-scrollbar-thumb {
            background-color: #e5e7eb;
            border-radius: 3px;

<body class="bg-gray-50 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Mobile Header -->
    <header class="md:hidden bg-white border-b border-gray-100 p-4 flex justify-between items-center z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <img src="../assets/images/logo bg.png" alt="Logo" class="site-logo w-12 h-12">
            <h1 class="font-montserrat font-bold text-gray-900 text-base">ZONE PRO</h1>
        </div>
        <button id="mobile-sidebar-toggle" class="p-2 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </header>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden transition-opacity duration-300 opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white border-r border-gray-100 flex flex-col z-50 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl md:shadow-none h-full">
        <!-- Sidebar Header -->
        <div class="p-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="../assets/images/logo bg.png" alt="Zone Pro Trader" class="site-logo w-14 h-14">
                <div>
                    <h1 class="font-montserrat font-bold text-gray-900 text-lg tracking-tight">ZONE PRO</h1>
                    <p class="text-[10px] font-bold text-accent-main tracking-widest uppercase">TRADER</p>
                </div>
            </div>
            <!-- Mobile Close Button -->
            <button id="mobile-sidebar-close" class="md:hidden text-gray-400 hover:text-gray-600 transition-colors p-2 hover:bg-gray-50 rounded-lg">

        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-2 space-y-1 pr-4">

                    <i data-lucide="newspaper" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                JOURNAL FEED
            </a>

            <!-- Journal Reporting (Active) -->
            <div class="group">
                <a href="#" class="flex items-center px-6 py-3.5 text-sm font-bold text-accent-dark bg-green-50 rounded-r-full border-l-4 border-accent-main transition-all group shadow-sm">
                    <div class="p-2 bg-green-100 rounded-lg mr-3 group-hover:bg-green-200 transition-colors">
                        <i data-lucide="layout-dashboard" class="w-5 h-5 text-accent-dark"></i>
                    </div>
                    JOURNAL REPORTING
                </a>
                
                <!-- Submenu -->
                <div class="ml-12 mt-1 space-y-1">
                    <a href="journal-reporting.html" class="flex items-center px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 rounded-lg transition-colors">
                        <i data-lucide="lightbulb" class="w-4 h-4 mr-2"></i>
                        DASHBOARD
                    </a>
                    <a href="add-trade.html" class="flex items-center px-4 py-2 text-sm font-bold text-accent-main bg-green-50/50 rounded-lg">
                        <i data-lucide="plus-circle" class="w-4 h-4 mr-2"></i>
                        ADD TRADE
                    </a>
                </div>
            </div>

            <!-- Investment Screener -->
            <a href="investment-screener.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="search" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                INVESTMENT SCREENER
            </a>

            <!-- Intraday -->
            <a href="intraday.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="clock" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                INTRADAY
            </a>

            <!-- Heatmap -->
            <a href="heatmap.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="grid" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                HEATMAP
            </a>

            <!-- Options (F&O) -->
            <a href="options.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="trending-up" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                OPTIONS (F&O)
            </a>

            <!-- Other Tools -->
            <a href="other-tools.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                OTHER TOOLS
            </a>

            <!-- Announcements -->
            <a href="announcements.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="megaphone" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                ANNOUNCEMENTS
            </a>

            <!-- Open a Demat Account -->
            <a href="open-demat-account.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="briefcase" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                OPEN A DEMAT ACCOUNT
            </a>

            <!-- My Profile -->
            <a href="my-profile.html" class="flex items-center px-6 py-3.5 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-r-full transition-all group border-l-4 border-transparent hover:border-gray-200">
                <div class="p-2 bg-gray-50 rounded-lg mr-3 group-hover:bg-gray-100 transition-colors">
                    <i data-lucide="user" class="w-5 h-5 text-gray-400 group-hover:text-gray-600"></i>
                </div>
                MY PROFILE
            </a>
        </nav>

        <!-- Logout -->
        <div class="p-6 border-t border-gray-100 mt-auto">
            <button id="logout-btn" type="button" class="w-full flex items-center px-4 py-3 text-sm font-medium text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all group cursor-pointer border-0 bg-transparent">
                <i data-lucide="log-out" class="w-5 h-5 mr-3 group-hover:text-red-600 transition-colors"></i>
                LOGOUT
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50 p-4 md:p-12">
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-start md:items-center gap-4 md:gap-5 mb-8 md:mb-10">
            <a href="dashboard.html" class="p-2.5 bg-white border border-gray-200 hover:bg-gray-50 rounded-xl shadow-sm transition-all group flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-5 h-5 text-gray-500 group-hover:text-accent-main transition-colors"></i>
                <span class="hidden md:inline text-sm font-bold text-gray-600 group-hover:text-accent-main uppercase">Back to Dashboard</span>
            </a>
            <div class="p-3 md:p-4 bg-green-50 rounded-2xl shadow-sm border border-green-100">
                <i data-lucide="plus-circle" class="w-6 h-6 md:w-8 md:h-8 text-accent-main"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight uppercase">Add Trade</h1>
                <p class="text-sm md:text-base text-gray-500 mt-1 font-medium">Record your latest trade details</p>
            </div>
        </div>

        <!-- Add Trade Form Card -->
        <div class="bg-white rounded-3xl shadow-lg border border-gray-100 p-6 md:p-10 max-w-4xl">
            <form class="space-y-8" id="add-trade-form">
                
                <!-- Stock Name -->
                <div class="space-y-2">
                    <label class="flex items-center text-sm font-bold text-gray-700">
                        <span class="w-2 h-2 rounded-full bg-dot-green mr-2"></span>
                        Stock Name
                    </label>
                    <input name="symbol" type="text" placeholder="e.g., RELIANCE, TATAMOTORS" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent-main focus:border-transparent transition-all placeholder-gray-400 text-gray-700 font-medium">
                </div>

                <!-- Trade Type -->
                <div class="space-y-2">
                    <label class="flex items-center text-sm font-bold text-gray-700">
                        <span class="w-2 h-2 rounded-full bg-dot-purple mr-2"></span>
                        Trade Type
                    </label>
                    <div class="relative">
                        <select name="type" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent-main focus:border-transparent transition-all text-gray-700 font-medium appearance-none cursor-pointer">
                            <option value="" disabled selected>Select trade type</option>
                            <option value="intraday">Intraday</option>
                            <option value="swing">Swing</option>
                            <option value="longterm">Long Term</option>
                            <option value="options">Options (F&O)</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-500">
                            <i data-lucide="chevron-down" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

                <!-- P&L and Capital Row -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- P&L -->
                    <div class="space-y-2">
                        <label class="flex items-center text-sm font-bold text-gray-700">
                            <span class="w-2 h-2 rounded-full bg-dot-green mr-2"></span>
                            P&L (₹)
                        </label>
                        <input name="pnl" type="number" placeholder="e.g., 2500" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent-main focus:border-transparent transition-all placeholder-gray-400 text-gray-700 font-medium">
                    </div>

                    <!-- Capital -->
                    <div class="space-y-2">
                        <label class="flex items-center text-sm font-bold text-gray-700">
                            <span class="w-2 h-2 rounded-full bg-dot-orange mr-2"></span>
                            Capital (₹)
                        </label>
                        <input name="capital" type="number" placeholder="e.g., 50000" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent-main focus:border-transparent transition-all placeholder-gray-400 text-gray-700 font-medium">
                    </div>
                </div>

                <!-- Trade Date -->
                <div class="space-y-2">
                    <label class="flex items-center text-sm font-bold text-gray-700">
                        <span class="w-2 h-2 rounded-full bg-dot-green mr-2"></span>
                        Trade Date
                    </label>
                    <div class="relative">
                        <input name="date" type="date" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent-main focus:border-transparent transition-all text-gray-700 font-medium">
                    </div>
                </div>

                <!-- Notes -->
                <div class="space-y-2">
                    <label class="flex items-center text-sm font-bold text-gray-700">
                        <span class="w-2 h-2 rounded-full bg-dot-gray mr-2"></span>
                        Notes (Optional)
                    </label>
                    <textarea name="notes" rows="4" placeholder="Add any notes about this trade..." class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent-main focus:border-transparent transition-all placeholder-gray-400 text-gray-700 font-medium resize-none"></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center gap-4 pt-6 mt-6 border-t border-gray-100">
                    <button id="save-trade" type="button" class="flex-1 bg-accent-main text-white py-4 px-6 rounded-xl font-bold hover:bg-accent-dark transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 transform active:scale-[0.98]">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                        SAVE TRADE
                    </button>
                    <button type="reset" class="px-6 py-4 bg-gray-50 text-gray-500 font-bold rounded-xl hover:bg-gray-100 transition-all flex items-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                        RESET
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Mobile Sidebar Logic
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mobileSidebarToggle = document.getElementById('mobile-sidebar-toggle');
        const mobileSidebarClose = document.getElementById('mobile-sidebar-close');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
            setTimeout(() => {
                sidebarOverlay.classList.toggle('opacity-0');
            }, 50);
        }

        if (mobileSidebarToggle) mobileSidebarToggle.addEventListener('click', toggleSidebar);
        if (mobileSidebarClose) mobileSidebarClose.addEventListener('click', toggleSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
    </script>
    <script>
        (function(){
          const btn = document.getElementById('save-trade');
          const form = document.getElementById('add-trade-form');
          if (!btn || !form) return;
          
          btn.addEventListener('click', async function() {
            const uid = localStorage.getItem('zp_uid');
            if (!uid) {
              alert('Please login first.');
              window.location.href = 'login.html';
              return;
            }
            
            const symbol = form.symbol.value.trim();
            const type = form.type.value;
            const pnl = form.pnl.value;
            const capital = form.capital.value;
            const date = form.date.value;
            const notes = form.notes.value.trim();
            
            if (!symbol || !type || !date || !pnl || !capital) {
              alert('Please fill all required fields (Symbol, Type, P&L, Capital, and Date).');
              return;
            }
            
            const data = {
              symbol: symbol,
              type: type,
              pnl: Number(pnl),
              capital: Number(capital),
              date: date,
              notes: notes
            };
            
            // Show loading state
            const originalBtnContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Saving...';
            lucide.createIcons();
            
            try {
              const res = await fetch('/api/trades', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-UID': uid
                },
                body: JSON.stringify(data)
              });
              
              const json = await res.json();
              if (res.ok && json.ok) {
                alert('Trade saved successfully!');
                form.reset();
                window.location.href = 'journal-reporting.html';
              } else {
                alert('Failed to save trade: ' + (json.error || 'Unknown error'));
              }
            } catch (e) {
              console.error('Error saving trade:', e);
              alert('Network error. Please try again.');
            } finally {
              btn.disabled = false;
              btn.innerHTML = originalBtnContent;
              lucide.createIcons();
            }
          });
        })();
    </script>
</body>
</html>
